[server]
host = "0.0.0.0"
port = 8500

[lsl]
# How often (seconds) to scan for new/lost LSL streams (after resolve_streams returns)
discovery_interval_seconds = 0.5
# Max seconds to wait for a sample before polling again
pull_timeout_seconds = 1.0

[database]
# Path to the SQLite database file (relative to Backend/).
# The database/ directory will be created automatically at startup if it does not exist.
path = "../database/labreview.db"

[frontend]
# Port for the embedded static file server that serves the frontend/ folder.
# Change this if 3000 is already in use on the target machine.
port = 3000
# Automatically open the dashboard in the default browser on startup.
# Set to false if you prefer to open it manually.
open_browser = true
