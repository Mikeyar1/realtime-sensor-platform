<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitts live card layout fixture</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages/live-intel.css">
  <link rel="stylesheet" href="../js/features/aar/aar-dashboard.css">
  <style>
    body { margin: 0; background: #f1f4f8; }
    .fixture { display: flex; min-height: 100vh; }
    .fixture-sidebar { width: 280px; flex: none; background: #192e4b; color: white; padding: 36px 20px; box-sizing: border-box; }
    .fixture-main { flex: 1; min-width: 0; }
    .fixture-ribbon { padding: 26px 40px; border-bottom: 1px solid #d5dce5; font-weight: 700; }
  </style>
</head>
<body>
  <div class="fixture">
    <aside class="fixture-sidebar"><h2>LabReview</h2><p>Live performance</p></aside>
    <main class="fixture-main li-session-view">
      <div class="fixture-ribbon">Fitts-PVT_Clay &nbsp; <small>Metrics: Custom</small></div>
      <div class="li-round-section li-round-section--standard">
        <div class="li-round-current">
          <details class="li-round-active" open>
            <summary>Round 1 · live · Baseline</summary>
            <div class="li-round-detail-body">
              <div class="li-round-meta"><p class="li-round-settings">Preset: <strong>Baseline</strong> · Distance: 10m · Visibility: 2s · Spawn interval: 2s · Targets: 15 · Concurrent: 1</p></div>
              <div class="li-round-card-host" id="fixture-cards"></div>
            </div>
          </details>
        </div>
      </div>
      <div class="li-section li-section--physio">
        <div class="li-section__header"><span class="li-section__title">Physiological Data</span></div>
        <div class="li-metric-grid li-metric-grid--physio">
          <div class="metric-card metric-card--physio"><div class="metric-card__label">Heart Rate</div><div class="metric-card__value">—</div><div class="metric-card__unit">bpm</div></div>
          <div class="metric-card metric-card--physio"><div class="metric-card__label">HRV (RMSSD)</div><div class="metric-card__value">—</div><div class="metric-card__unit">ms</div></div>
          <div class="metric-card metric-card--physio"><div class="metric-card__label">Pupil Diameter</div><div class="metric-card__value">—</div><div class="metric-card__unit">mm</div></div>
        </div>
      </div>
    </main>
  </div>
  <div id="fixture-test-root" style="display:none">
    <div id="topbar-slot"></div>
    <div id="page-live-intel"></div>
  </div>
  <script src="../js/features/aar/standardized.js"></script>
  <script>
    LabReview.AAR.Standardized.createMetricCards('PVT_FITTS').mount(
      document.getElementById('fixture-cards'), {
        total_trials: 13, duration_s: 26.19, hits_pct: 23.1, omissions: 10,
        response_rate_pct: 23.1, omission_rate_pct: 76.9,
        rt_median_ms: 1336.4, rt_mean_ms: 1309.6,
        rt_stdev_ms: 179.5, rt_min_ms: 1118.2, rt_max_ms: 1550.4,
      });
  </script>
  <script>
    const handlers = new Map();
    LabReview.EventBus = {
      on(name, callback) { handlers.set(name, [...(handlers.get(name) || []), callback]); },
      emit(name, payload) { for (const callback of handlers.get(name) || []) callback(payload); },
    };
    LabReview.TopBarManager = {
      register(_name, render) { render(document.getElementById('topbar-slot')); },
    };
    LabReview.StreamRouter = {
      activateLive() {}, deactivateLive() {}, send() {},
    };
    LabReview.MetricCardRenderer = {
      renderCards() {}, updateAllCards() {}, freezeCards() {}, clearCards() {},
    };
    LabReview.AAR.Dashboard = { mount() {}, reset() {}, unmount() {} };
  </script>
  <script src="../js/pages/live-intel.js"></script>
  <script>
    try {
      const emit = LabReview.EventBus.emit;
      const check = (condition, message) => { if (!condition) throw new Error(message); };
      const metric = { total_trials: 2, hits_pct: 50, omissions: 1, response_rate_pct: 50,
        omission_rate_pct: 50, rt_median_ms: 400, rt_mean_ms: 400, scoring_status: 'scored' };
      const round1 = { round_number: 1, attempt: 1, ended_at: null,
        preset_label: 'Baseline', settings: {}, metrics: metric };
      const finished1 = { ...round1, ended_at: 5, ended_reason: 'completed' };
      const round2 = { ...round1, round_number: 2, preset_label: 'Hard' };
      const finished2 = { ...round2, ended_at: 12, ended_reason: 'completed' };
      LabReview.LiveIntelPage.init();
      emit('page-changed', 'live-intel');
      emit('scoring-waiting', { scenario_name: 'Fitts-PVT_Clay' });
      check(!document.getElementById('li-conn-label').textContent.includes('Custom metrics'),
        'initial status');
      emit('scenario-started', { task_type: 'PVT_FITTS', drill_key: 'fitts_pvt_clay',
        scenario_name: 'Fitts-PVT_Clay', session_id: 'fixture-session', source: 'custom',
        assessment_profile: 'pvt_fitts_core' });
      check(document.getElementById('li-round-current').textContent.includes('Waiting for first round'),
        'before first round');
      const sendRounds = rounds => emit('custom-lsl-event', { session_id: 'fixture-session', rounds });
      sendRounds([round1]);
      check(document.getElementById('li-round-current').style.display !== 'none', 'active round');
      check(document.querySelector('#li-round-current .li-round-active').open, 'live round expanded');
      check(document.querySelectorAll('#li-round-current .li-round-card-host .aar-card').length === 16, 'active PVT cards');
      check(document.getElementById('li-behavioral-section').style.display === 'none', 'duplicate cards');
      const activeName = document.querySelector('#li-round-current .li-round-participant-input');
      activeName.value = 'Alice';
      activeName.dispatchEvent(new Event('input'));
      sendRounds([finished1]);
      check(document.getElementById('li-round-current').textContent.includes('Waiting for next round'),
        'between rounds');
      check(!document.querySelector('.li-round-previous').open, 'collapsed by default');
      check(document.querySelector('.li-round-previous .li-round-participant-input').value === 'Alice',
        'participant retained');
      document.querySelector('.li-round-previous').open = true;
      sendRounds([finished1, round2]);
      check(document.getElementById('li-round-current').textContent.includes('Round 2'), 'second round');
      check(document.querySelector('#li-round-current .li-round-active').open, 'next round expanded');
      check(document.querySelector('.li-round-previous').open, 'round expansion retained');
      emit('metrics-ready', { session_uuid: 'fixture-session', rounds: [finished1, finished2],
        metrics: { ...metric, completed_rounds: 2 }, auto_saved: true });
      check(document.getElementById('li-round-final').textContent.includes('Grand Total / Average'),
        'grand total');
      check(document.querySelectorAll('#li-round-final .aar-card').length === 17, 'final PVT cards');
      check(document.querySelectorAll('.li-round-previous').length === 2, 'two collapsed rounds');
      document.title = 'PASS Fitts live lifecycle';
    } catch (error) {
      document.title = `FAIL Fitts live lifecycle: ${error.message}`;
    }
  </script>
</body>
</html>
