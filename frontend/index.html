<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabReview — Human Performance Dashboard</title>
  <meta name="description"
    content="Live session monitoring and replay of physiological and behavioral data for VirTra-based training research." />

  <!-- Design System -->
  <link rel="stylesheet" href="css/variables.css?v=sidebar-190" />
  <link rel="stylesheet" href="css/layout.css?v=main-screen-1" />

  <!-- Page CSS (feature-based) -->
  <link rel="stylesheet" href="css/pages/topbar.css?v=start-blue-2" />
  <link rel="stylesheet" href="css/pages/live-intel.css?v=round-metrics-2" />
  <link rel="stylesheet" href="css/pages/perf-review.css?v=session-detail-readability-1" />

  <!-- AAR Dashboard -->
  <link rel="stylesheet" href="js/features/aar/aar-dashboard.css?v=fitts-cards-2" />

  <!-- ES module preloads — shared utilities (imported by app.js) -->
  <link rel="modulepreload" href="js/shared/constants.js" />
  <link rel="modulepreload" href="js/shared/format.js" />
</head>

<body>

  <div id="app">

    <header id="topbar-slot">
      <!-- Populated by TopBarManager when a page activates -->
    </header>

    <div id="middle">

      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-brand">
          <span class="sidebar-brand__mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><path d="M3 16h6l3-7 5 15 4-8h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="sidebar-brand__text"><span class="sidebar-brand__eyebrow">VIRTRA</span><strong>LabReview</strong></span>
        </div>

        <!-- Navigation -->
        <nav class="sidebar-nav">
          <div class="sidebar-section-label">Workspace</div>

          <div class="nav-item active" data-page="live-intel" id="nav-live-intel" role="button" tabindex="0">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
            <span class="nav-label">Live performance</span>
          </div>

          <div class="nav-item" data-page="perf-review" id="nav-perf-review" role="button" tabindex="0">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>
            <span class="nav-label">Session History</span>
          </div>

        </nav>

        <!-- Connected Streams accordion — populated by live-intel.js -->
        <div class="sidebar-streams" id="sidebar-streams">

          <button class="sidebar-streams__header" id="sidebar-streams-toggle" aria-expanded="true"
            aria-controls="sidebar-streams-body">
            <span class="sidebar-streams__title">Connected Streams</span>
            <span class="sidebar-streams__chevron" id="sidebar-streams-chevron">▾</span>
          </button>

          <div class="sidebar-streams__body" id="sidebar-streams-body">
            <div class="sidebar-stream-list" id="sidebar-stream-list">
              <span class="sidebar-stream-empty">No mapped streams detected.</span>
            </div>
          </div>

        </div>

      </aside>

      <!-- Main Content -->
      <main id="main-content">

        <div class="page active" id="page-live-intel">
          <!-- Populated by LiveIntelPage -->
        </div>

        <div class="page" id="page-perf-review">
          <!-- Populated by PerfReviewPage -->
        </div>

      </main>
    </div>

  </div>

  <!-- Scripts: core → pages -->

  <!-- Core infrastructure -->
  <script src="js/core/plugin-registry.js"></script>
  <script src="js/core/event-bus.js"></script>
  <script src="js/core/stream-router.js?v=round-metrics-2"></script>
  <script src="js/core/mode-manager.js"></script>
  <script src="js/core/sidebar.js?v=main-screen-1"></script>
  <script src="js/core/topbar-manager.js"></script>

  <!-- AAR Dashboard: router + task-type display modules -->
  <!-- To add a new task type: create task-types/<name>.js and add one line here -->
  <script src="js/features/aar/standardized.js?v=round-metrics-2"></script>
  <script src="js/features/aar/aar-dashboard.js"></script>

  <!-- Config: stream display registry + drill metric card registry -->
  <script src="js/config/stream_catalog.js"></script>
  <script src="js/config/drill_metrics.js"></script>

  <!-- Shared: metric card renderer -->
  <script src="js/shared/metric-card-renderer.js?v=live-flash-1"></script>

  <!-- Page controllers -->
  <script src="js/pages/live-intel.js?v=round-metrics-2"></script>
  <script src="js/pages/perf-review.js?v=round-physio-1"></script>

  <!-- App bootstrap (must be last; type=module defers automatically) -->
  <script type="module" src="js/app.js?v=main-screen-1"></script>

</body>

</html>
