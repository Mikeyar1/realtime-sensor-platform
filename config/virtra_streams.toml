# Shared VirTra stream identity, lifecycle, and custom envelope field paths.
# Scenario source policy and event mappings live in backend/scenarios/*/scenario.toml.
# An operator copy may still include [drills.*] tables as explicit overrides.

schema_version = 2

[streams.native]
names = ["V_300"]
types = ["VirTraEvents"]
match = "any"                      # name OR type, matching current native routing

[streams.custom]
names = ["virtra_lsl"]
types = ["VirTra Events"]
match = "type"                     # custom outlets may change name between drills

[custom_lifecycle]
allow_round_start_without_scenario_start = true

[lifecycle]
scenario_start = ["Scenario Started"]
scenario_stop = ["Scenario Stopped", "Scenario Ended", "Scenario Destroyed"]
round_start = ["Round Started"]
round_complete = ["Round Completed"]
round_reset = ["Round Reset"]
component_change = ["Phase Changed"]

[rounds]
aggregate_statuses = ["completed"]
display_reset_rounds = true
display_incomplete_rounds = true
reuse_round_number_creates_attempt = true
aggregate_duration_basis = "sum_round_trial_spans"

[fields]
drill_type = ["drill_type"]
external_scenario_id = ["scenario_id"]
scenario_name = ["scenario_name", "scenario_display_name"]
schema_version = ["schema_version", "lsl_schema_version"]
round_number = ["round"]
component = ["phase", "data.phase"]
scenario_time_seconds = ["scenario_time_seconds"]
timestamp_utc = ["timestamp_utc"]
settings = ["data.settings", "data"]
script_metrics = ["data.metrics"]
target_id = ["data.target_id", "data.target.target_id", "data.shot.entity_id", "data.entity_id"]
shot_id = ["data.shot.shot_id", "data.shot_id"]
trial_index = ["data.trial_index", "data.target.trial_index", "data.presentation_index"]
reaction_time_seconds = ["data.shot.reaction_time_seconds", "data.reaction_time_seconds"]
