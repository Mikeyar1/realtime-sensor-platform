# drill_registry.toml — Cognitive Attribute & Scenario Registry
#
# Maps VirTra "Scenario" field values (from Scenario Started events) to a
# cognitive attribute. The Backend uses this to determine:
#   1. Which cognitive attribute is active (and its drill_key for the UI)
#   2. Which tracker to use (task_type → ATTRIBUTE_REGISTRY in cognitive_attributes/)
#   3. Which metrics function to run (metric_module)
#   4. What parameters to configure the tracker with (params)
#   5. Which targets are go / no_go / ignore (for GNG-type attributes)
#
# ─────────────────────────────────────────────────────────────────────────────
# HOW TO ADD A NEW SCENARIO TO AN EXISTING COGNITIVE ATTRIBUTE
#   1. Add the scenario name string to the `scenarios` list below.
#      Match EXACTLY what appears in the VirTra "Scenario" metadata field.
#   2. Done — no code changes needed.
#
#   If the scenario needs different timing than the attribute defaults:
#   Add a [cognitive_attributes.<key>.scenario_params."<scenario name>"] block
#   with only the values that differ (e.g. grace_window_ms = 300).
#
# HOW TO ADD A NEW COGNITIVE ATTRIBUTE
#   1. Create backend/cognitive_attributes/<name>/tracker.py
#   2. Create backend/cognitive_attributes/<name>/metrics.py
#   3. Add one entry to ATTRIBUTE_REGISTRY in cognitive_attributes/__init__.py
#   4. Add a [cognitive_attributes.<name>] section below.
#   Done.
#
# SOURCE
# Scenario names verified against 21 VirTra CSV files from Exercises 6-11
# (Feb 2026 - Jul 2026)
# ─────────────────────────────────────────────────────────────────────────────


# ── Shared events captured for ALL cognitive attributes ───────────────────────
#
# These events are captured for every session regardless of cognitive attribute.
# They provide the shared foundation for cross-attribute metrics and the event log.
#
# Actor appearance notes:
#   "Actor Event" with category "FA - First Appearance" → actor first appeared
#   "Actor IsVisible Changed" with IsVisible=True       → actor visibility toggled on
#   Both are needed: FA for initial appearance, IsVisible for dynamic reappearance.
#
[shared_events]
events = [
    # Scenario lifecycle
    "Scenario Started",
    "Scenario Stopped",
    "Scenario Launching",
    "Scenario Ready To Play",
    "Scenario Paused",

    # Shooting events
    "Shot Fired",
    "Shot Hit",
    "Shot Miss",
    "Unscored Hit",

    # Target lifecycle
    "Target Activated",
    "Target Deactivated",
    "New Target",
    "Target Removed",

    # Actor events
    # Actor Event (category = "FA - First Appearance") → actor first appeared
    "Actor Event",
    # Actor IsVisible Changed (IsVisible=True) → actor visibility toggled on/off
    "Actor IsVisible Changed",
    # Actor State Changed → actor behavioral state transition
    "Actor State Changed",
]


# ── Cognitive Attributes ──────────────────────────────────────────────────────


[cognitive_attributes.pvt]
label         = "PVT"
task_type     = "PVT"                # → cognitive_attributes/pvt/tracker.py
metric_module = "pvt"                # → cognitive_attributes/pvt/metrics.py
description   = "Sustained attention assessment — trainee responds to visual stimuli as rapidly as possible."
scenarios     = [
    "PVT",
    "LVL1_PVT_FITTS_ASSESSMENT",
    "LVL 1 PVT FITTS ASSESSMENT",
    "PVT",
    "Snake Drill",
]
# Target filtering for PVT.
# valid_targets  = only these names open a trial (case-insensitive).
#                  Empty list → accept any name not in ignore_targets.
# ignore_targets = these names are ALWAYS skipped.
#   Ivan       — is shot to START the drill, not a stimulus.
#   fixation*  — fixation crosses between stimuli, not a stimulus.

[cognitive_attributes.pvt.targets]
valid_targets  = ["neutral"]
ignore_targets = ["Ivan", "fixation", "fixation (2)", "fixation (3)", "end_of_round_target"]

# Default parameters for ALL PVT scenarios.
# Override per-scenario with [cognitive_attributes.pvt.scenario_params."<name>"]
[cognitive_attributes.pvt.params]
# Lapse detection: multiplier applied to the session median RT.
# lapse_threshold = median_rt × lapse_multiplier (e.g. 843 ms × 2.0 = 1686 ms).
lapse_multiplier = 1.5


# ── Custom VirTra LSL Drills ─────────────────────────────────────────────────
#
# These are driven by the script-integrated custom LSL stream (name
# "virtra_lsl", type "VirTra Events"), not by the native V_300 stream.
# They resolve by the payload drill_type field instead of native scenario name.

[custom_lsl_drills.multicolor_gng]
drill_key     = "gng"
label         = "Go/No-Go"
task_type     = "GNG"                # → cognitive_attributes/multicolor_gng/tracker.py
metric_module = "gng"                # → cognitive_attributes/multicolor_gng/metrics.py
description   = "Inhibitory control assessment driven by scenario-script custom LSL metadata."


[cognitive_attributes.behavioral_discrimination]
label         = "Behavioral Discrimination"
task_type     = "DISCRIMINATION"     # → cognitive_attributes/discrimination/tracker.py
metric_module = "discrimination"     # → cognitive_attributes/discrimination/metrics.py
description   = "Two-phase drill: PVT vigilance block, then threat/non-threat discrimination under time pressure."
scenarios     = [
    "Drill 3A (Single-Target Discrimination)",
    "Drill 3B",
]

# Threat class is read from the target name suffix (*_threat / *_nonthreat),
# verified against Drill 3A and Drill 3B captures — no per-name list needed.
#   Ivan      — shot to START the drill, not a stimulus.
#   fixation* — fixation crosses between stimuli.
[cognitive_attributes.behavioral_discrimination.targets]
pvt_targets    = ["neutral"]
ignore_targets = ["Ivan", "fixation", "fixation (2)", "fixation (3)"]

[cognitive_attributes.behavioral_discrimination.params]
# ms to wait after Target Deactivated for a late impact before scoring a withhold.
grace_window_ms  = 200
# PVT-phase lapse threshold = median RT × this.
lapse_multiplier = 1.5


# ── Calibration / Non-scored ──────────────────────────────────────────────────
# Scenarios listed here are explicitly recognized as non-training.
# The Backend logs "ignoring known non-drill scenario" and starts no session.
# Any scenario NOT listed in cognitive_attributes.* OR calibration is also
# silently ignored.
[calibration]
scenarios = ["Boresight"]
