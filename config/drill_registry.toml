# Shared native event allowlist.
# Scenario aliases and source mappings live in backend/scenarios/*/.
# Scenario targets and parameters live in backend/scenarios/*/native.toml.

[shared_events]
events = [
    # Scenario lifecycle
    "Scenario Started",
    "Scenario Stopped",
    "Scenario Launching",
    "Scenario Ready To Play",
    "Scenario Paused",

    # Shooting events
    "Shot Fired",
    "Shot Hit",
    "Shot Miss",
    "Unscored Hit",

    # Target lifecycle
    "Target Activated",
    "Target Deactivated",
    "New Target",
    "Target Removed",

    # Actor events
    # Actor Event (category = "FA - First Appearance") → actor first appeared
    "Actor Event",
    # Actor IsVisible Changed (IsVisible=True) → actor visibility toggled on/off
    "Actor IsVisible Changed",
    # Actor State Changed → actor behavioral state transition
    "Actor State Changed",
]
